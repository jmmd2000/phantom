name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in apps/server/package.json"
            exit 1
          fi

      - name: Check the changelog has an entry
        run: node scripts/changelogEntry.js "${GITHUB_REF_NAME#v}"

  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The published package is built with no cache, so a poisoned cache can't reach it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npm
        run: |
          cp README.md LICENSE apps/server/
          cd apps/server
          npm publish --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelogEntry.js "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
